name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # 再生成した metrics.json / フォントを push し返すため
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch source fonts
        run: npm run fonts:fetch

      # ビルド → サブセット → 再ビルドの順（理由は scripts/subset-fonts.mjs 冒頭）
      - name: Build
        run: npm run build:full

      # 予算割れ（lighthouserc.json の assert）でここが失敗し、ビルドが落ちる。
      #
      # @lhci/cli は devDependency として完全固定し、npx で取りに行かない。
      # Lighthouse の版が変わると同じページから別の数値が出るため
      # （lighthouse 12.1.0 と 13.6.0 で FCP 1507ms / 603ms。#57、仕様書 §8）、
      # 計測器は lockfile で固定する。lhci を上げるときは lighthouse も合わせること。
      - name: Run Lighthouse CI
        run: npx lhci autorun

      # 「このサイトについて」ページが読む metrics.json を更新する。
      # 自分で測り直さず、上の autorun が .lighthouseci/ に残したレポートを読む。
      # 公開する数値と、予算割れを判定した数値を同一の計測にするため（#57）。
      # 必ず「Run Lighthouse CI」の後に置くこと。
      - name: Regenerate metrics.json
        if: github.event_name == 'push'
        run: npm run metrics:build

      # サブセット結果（フォントと unicode-range）もビルドで再生成される。
      # コンテンツを足したのに fonts:subset を回し忘れた場合、
      # コミット済みのフォントは字形が欠けたままになるのでここで揃える。
      #
      # コミットメッセージに [skip ci] を付けないこと。
      #
      # このマーカーは GitHub Actions のループ防止のつもりで付いていたが、
      # そもそも GITHUB_TOKEN による push は仕様上ワークフローを起動しないため
      # 不要だった。一方 Cloudflare Workers Builds はこのマーカーを読んで
      # デプロイを止める。結果、main へマージしても本番に反映されない事故が起きた
      # （2026-08-27: PR #22 のマージ後、Workers Builds が skipped のまま
      #  本番が旧版を配信し続けた）。
      - name: Commit regenerated artifacts
        if: github.event_name == 'push'
        run: |
          paths="src/data/metrics.json public/fonts src/styles/fonts-jp.generated.css"
          if git diff --quiet -- $paths; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "chore: update metrics and font subsets"
          git push
